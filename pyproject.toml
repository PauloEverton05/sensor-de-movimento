[project]
name = "sentinel-ai"
version = "0.2.0"
description = "SENTINEL AI — central local de vigilância com visão computacional"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PauloEverton05" }]
dependencies = [
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "keyring>=25.0",
]

[project.scripts]
sentinel-agent = "sentinel.agent.app:main"
sentinel-ctl = "sentinel.ipc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = [
    "S101",  # assert é permitido (testes e invariantes internas)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S108", "S105", "S106", "E501"]
"scripts/**" = ["S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sentinel"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes de hardware (webcam real) nunca rodam por padrão: use `pytest -m hardware`.
addopts = "-ra --strict-markers -m \"not hardware\""
markers = [
    "integration: usa processos, SQLite e IPC reais",
    "hardware: exige hardware real (nunca roda no CI)",
]

# ---------------------------------------------------------------- import-linter
# Fronteiras da arquitetura (docs/ARQUITETURA.md §7). Verificado no CI.
[tool.importlinter]
root_packages = ["sentinel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain é puro (não depende de nenhuma outra camada)"
type = "forbidden"
source_modules = ["sentinel.domain"]
forbidden_modules = ["sentinel.common", "sentinel.persistence", "sentinel.ipc", "sentinel.agent"]

[[tool.importlinter.contracts]]
name = "ipc não depende do agente nem da persistência (a interface usará só ipc)"
type = "forbidden"
source_modules = ["sentinel.ipc"]
forbidden_modules = ["sentinel.agent", "sentinel.persistence"]

[[tool.importlinter.contracts]]
name = "persistence não depende do agente nem do ipc"
type = "forbidden"
source_modules = ["sentinel.persistence"]
forbidden_modules = ["sentinel.agent", "sentinel.ipc"]

[[tool.importlinter.contracts]]
name = "security não depende do agente, ipc ou persistência"
type = "forbidden"
source_modules = ["sentinel.security"]
forbidden_modules = ["sentinel.agent", "sentinel.ipc", "sentinel.persistence"]

[[tool.importlinter.contracts]]
name = "ipc não carrega OpenCV/numpy (cliente leve para a interface)"
type = "forbidden"
source_modules = ["sentinel.ipc"]
forbidden_modules = ["cv2", "numpy"]
allow_indirect_imports = false
