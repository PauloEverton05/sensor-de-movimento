name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade (lint, formato, tipos, fronteiras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    name: Testes (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m "not hardware"

  package:
    name: Pacote do agente + fumaça (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python scripts/build_agent.py
      - run: uv run python scripts/smoke_packaged_agent.py
      - name: Instalador (Windows 11) + teste de instalação real
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          uv run python scripts/build_installer.py
          uv run python scripts/test_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-agent-${{ runner.os }}-${{ runner.arch }}
          path: dist/sentinel-agent/
          retention-days: 7
