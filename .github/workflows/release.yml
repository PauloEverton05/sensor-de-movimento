name: Release

# Plataforma de distribuição: Windows 11 x64 (decisão do responsável, 2026-11-09).
# Linux e macOS continuam testados no CI, mas não são publicados.
#
# Tag "v*" → testa, gera o instalador, instala de verdade num Windows limpo,
# roda o teste de fumaça contra a instalação e publica o pré-lançamento.
# Execução manual → só gera os artefatos (ensaio), sem publicar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 11 x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m "not hardware"
      - run: uv run python scripts/build_agent.py
      - run: uv run python scripts/smoke_packaged_agent.py

      - name: Versão
        id: ver
        shell: bash
        run: echo "version=$(uv run python -c 'import sentinel; print(sentinel.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Conferir tag × versão
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME não corresponde à versão ${{ steps.ver.outputs.version }}" >&2
            exit 1
          fi

      - name: Instalador + teste de instalação real
        run: |
          choco install innosetup --no-progress -y
          uv run python scripts/build_installer.py
          uv run python scripts/test_installer.py

      - name: Pacote portátil e checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/installer/*-setup.exe dist/release/
          # Nome fixo: o link releases/latest/download/SentinelAI-Setup.exe nunca muda.
          Copy-Item dist/installer/*-setup.exe dist/release/SentinelAI-Setup.exe
          Copy-Item docs/TESTE-FASE-3.md dist/sentinel-agent/COMO-TESTAR.txt
          Compress-Archive -Path dist/sentinel-agent/* `
            -DestinationPath "dist/release/SentinelAI-$v-windows11-x64-portable.zip"
          Get-ChildItem dist/release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows11-x64
          path: dist/release/*
          retention-days: 14

  publish:
    name: Publicar pré-lançamento
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Marcada como "latest" (e não prerelease) para o link de download direto funcionar.
          gh release create "$GITHUB_REF_NAME" out/* \
            --latest \
            --title "Sentinel AI $GITHUB_REF_NAME (pré-lançamento, Windows 11)" \
            --notes-file docs/release-notes/"$GITHUB_REF_NAME".md
